[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-history"
dynamic = ["version"]
description = "Semantic history for agent-driven development. Records what you did and why."
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Zeng Deyang" },
]
keywords = ["agent", "git", "semantic-history", "intent", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/dozybot001/Intent"
Repository = "https://github.com/dozybot001/Intent"
Issues = "https://github.com/dozybot001/Intent/issues"
Changelog = "https://github.com/dozybot001/Intent/tree/main/docs/releases"

[project.scripts]
itt = "intent_cli.cli:main"

[project.optional-dependencies]
server = [
    "Authlib==1.6.12; python_version < '3.10'",
    "Authlib==1.9.1; python_version >= '3.10'",
    "httpx==0.28.1",
    "psycopg==3.2.13; python_version < '3.10'",
    "psycopg-binary==3.2.13; python_version < '3.10' and implementation_name != 'pypy'",
    "psycopg==3.3.4; python_version >= '3.10'",
    "psycopg-binary==3.3.4; python_version >= '3.10' and implementation_name != 'pypy'",
]
release = [
    "pytest==8.4.2",
    "pytest-xdist==3.8.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["intent_cli*", "apps*"]

[tool.setuptools.package-data]
"apps.inthub_web" = ["static/*"]

[tool.setuptools_scm]
# Source archives (GitHub ZIP, git archive) carry no tags.
fallback_version = "0.0.0+unknown"
