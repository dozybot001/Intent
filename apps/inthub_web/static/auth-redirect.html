<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fafafa">
    <title>IntHub · Tenon</title>
    <link rel="icon" type="image/svg+xml" href="/tenon-mark.svg">
    <link rel="preload" href="/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/theme.js?rev=options-1"></script>
    <link rel="stylesheet" href="/styles.css?rev=options-1">
  </head>
  <body class="login-transition">
    <main class="login-transition-card" aria-labelledby="transition-title">
      <img class="brand-mark" src="/inthub-mark.svg?rev=3" alt="IntHub" width="64" height="64">
      <h1 id="transition-title">Opening sign-in…</h1>
      <span id="transition-spinner" class="button-spinner" aria-hidden="true"></span>
      <p id="transition-error" class="is-hidden" role="alert"></p>
      <div class="transition-actions">
        <button id="transition-retry" class="is-hidden" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3L16 7.5"/><path d="M16 3.5v4h-4"/></svg>Retry</button>
        <a id="transition-return" href="/"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>Return to IntHub</a>
      </div>
      <div class="transition-preferences">
        <button data-language-switch class="language-button" type="button" aria-label="Switch language">中文</button>
        <button class="icon-button theme-switch" data-theme-switch type="button" aria-label="Switch theme"></button>
      </div>
    </main>
    <script src="/i18n.js?rev=options-1"></script>
    <script src="/auth-redirect.js?rev=options-1"></script>
  </body>
</html>
