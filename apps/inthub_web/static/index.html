<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IntHub</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell" id="shell">
      <header class="header">
        <div class="header-left">
          <span class="logo">IntHub</span>
          <div class="project-picker" id="project-picker">
            <button class="project-picker-trigger" id="project-picker-trigger" type="button">
              <span class="project-picker-label" id="project-picker-label">No projects yet</span>
              <span class="project-picker-arrow">&#9662;</span>
            </button>
            <div class="project-picker-dropdown" id="project-picker-dropdown"></div>
          </div>
        </div>
        <div class="header-right">
          <button id="logout-btn" class="logout-btn is-hidden" type="button">Lock</button>
          <button id="refresh-btn" type="button">Refresh</button>
          <div class="header-meta">
            <span class="header-meta-text" id="sync-chip"></span>
            <span class="header-meta-text" id="api-chip"></span>
          </div>
        </div>
      </header>

      <div class="main">
        <nav class="sidebar" id="sidebar">
          <div class="tab-bar">
            <button class="tab is-active" data-tab="intents">Intents <span class="tab-count" id="intent-count"></span></button>
            <button class="tab" data-tab="decisions">Decisions <span class="tab-count" id="decision-count"></span></button>
            <button class="tab" data-tab="snaps">Snaps <span class="tab-count" id="snap-count"></span></button>
          </div>
          <div class="sidebar-body" id="sidebar-body"></div>
        </nav>

        <section class="detail-pane" id="detail-pane">
          <button class="back-btn" id="back-btn" type="button">&larr; Back</button>
          <div class="detail-content" id="detail-content">
            <div class="empty-state">Select an object to inspect.</div>
          </div>
        </section>
      </div>

      <div class="drawer-overlay" id="drawer-overlay"></div>
      <aside class="drawer" id="drawer">
        <div class="drawer-header">
          <button class="drawer-close" id="drawer-close" type="button">&times;</button>
        </div>
        <div class="drawer-content" id="drawer-content"></div>
      </aside>

      <footer class="footer">
        <span id="status-line" class="muted">Loading&hellip;</span>
      </footer>
    </div>

    <div class="auth-gate is-hidden" id="auth-gate" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <form class="auth-card" id="auth-form">
        <span class="auth-mark">IntHub / private</span>
        <h1 id="auth-title">Unlock semantic history</h1>
        <p>This deployment is private. Enter its access token to create a temporary, read-only browser session.</p>
        <label for="auth-token">Access token</label>
        <input id="auth-token" name="token" type="password" autocomplete="current-password" required>
        <p class="auth-error is-hidden" id="auth-error" role="alert"></p>
        <button id="auth-submit" type="submit">Unlock IntHub</button>
        <small>The token is exchanged for an HttpOnly session cookie and is not stored in this page.</small>
      </form>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
