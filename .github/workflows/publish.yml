# Publishes a release to PyPI through trusted publishing, so no token is stored.
# Runs after a GitHub release goes out, which the release procedure does last.
# To publish an existing tag by hand: gh workflow run publish.yml -f tag=vX.Y.Z
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v7.6.6
        required: true

permissions:
  contents: read

jobs:
  pypi:
    # Set the repository variable PYPI_ENABLED once PyPI trusts this workflow.
    if: github.event_name == 'workflow_dispatch' || vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
