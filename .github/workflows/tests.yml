name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: inthub_test
          POSTGRES_USER: inthub_test
          POSTGRES_PASSWORD: inthub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inthub_test -d inthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: python -m pip install ".[server,release]"

      - name: Run tests
        run: python -m pytest -q
        env:
          INTHUB_TEST_POSTGRES_URL: postgresql://inthub_test:inthub_test_password@127.0.0.1:5432/inthub_test

      - name: Smoke-test installed CLI
        run: itt --help
