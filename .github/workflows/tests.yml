name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity for tests
        run: |
          git config --global user.name "intent-test"
          git config --global user.email "intent-test@example.com"

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest
