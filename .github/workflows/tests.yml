name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: inthub_test
          POSTGRES_USER: inthub_test
          POSTGRES_PASSWORD: inthub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inthub_test -d inthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: python -m pip install ".[server]" pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          INTHUB_TEST_POSTGRES_URL: postgresql://inthub_test:inthub_test_password@127.0.0.1:5432/inthub_test

      - name: Smoke-test installed CLI
        run: itt --help
