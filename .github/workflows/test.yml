# Test-only CI. Production releases never read from GitHub.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9: requires-python floor; 3.13: production image; 3.14: release qualification.
        python-version: ["3.9", "3.13", "3.14"]
    services:
      postgres:
        # postgres:18.4-bookworm, the digest pinned in deploy/inthub/runtime-images.lock.json
        image: postgres@sha256:16fa100a3a6e92c0556632870455e7f8c6f3df5cefddd67d6b95292732bd7ff0
        env:
          POSTGRES_DB: inthub_test
          POSTGRES_USER: inthub_test
          POSTGRES_PASSWORD: inthub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inthub_test -d inthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INTHUB_TEST_POSTGRES_URL: postgresql://inthub_test:inthub_test_password@127.0.0.1:5432/inthub_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # setuptools-scm derives the version from tags
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with server and test extras
        run: python -m pip install ".[server,release]"
      - name: Run tests
        run: python -m pytest -q -ra -n auto --dist loadfile
      - name: Smoke-test the installed CLI
        run: itt version
